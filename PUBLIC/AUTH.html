<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hyperion Orbit — Connexion</title>
  <link rel="icon" type="image/png" href="/ASSETS/UI/LOGO_MINI.png" />
  <script>
    // Bon formulaire dès le premier affichage sur /register : AUTH.js (module,
    // lancé après la vérification serveur) retire ensuite cette classe.
    (function () {
      var q = new URLSearchParams(location.search);
      if (location.pathname === "/register" && !q.has("verify") && !q.has("reset")) {
        document.documentElement.classList.add("routeJoin");
      }
    })();
  </script>

  <style>
    /* DA du jeu (style.css) : champs de la fenêtre Compte, bouton play du
       P.E.T, libellés cyan et liens orange. */
    :root{
      color-scheme: dark;
      --txt: #d7e2ff;
      --label: #7cecff;
      --orange: #ffa54a;
      --ok: #3dff8c;
      --danger: #ff6b7a;
      --gold: #ffd36b;
      --info: #8fcddd;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    html, body{ min-height:100%; }

    body{
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--txt);
      background: #050814;
      overflow-x: hidden;
    }
    button, input{ font-family: inherit; }

    /* Fond (inchangé) */
    .space{
      position: fixed;
      inset: 0;
      background: url('https://wallpapercave.com/wp/wp11333140.jpg') center center / cover no-repeat;
      z-index: 0;
    }
    .space::after{
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
    }

    .shell{
      --logo-w: min(400px, 82vw);
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px 24px;
      overflow-x: clip;
      /* Arrivée en fondu, sans déplacement. */
      animation: pageFade .7s ease .05s both;
    }
    @keyframes pageFade{ from{ opacity:0; } to{ opacity:1; } }

    /* Logo en haut de page, taille réservée (pas de saut au chargement). */
    .brand{
      position: relative;
      z-index: 2; /* toujours devant le fondu du formulaire */
      flex-shrink: 0;
      display: block;
      width: var(--logo-w);
      height: auto;
      aspect-ratio: 1774 / 887;
      margin: 0 auto;
      pointer-events: none;
      user-select: none;
      filter: drop-shadow(0 0 30px rgba(124,240,255,.38)) drop-shadow(0 10px 24px rgba(0,0,0,.6));
    }

    /* Formulaire centré à l'écran : marges auto + cale basse de la hauteur
       du logo (centre réel tant que la hauteur le permet). */
    .auth{ position: relative; width: min(340px, 100%); margin: auto 0; }
    .shell::after{ content: ''; flex: 0 1 calc(var(--logo-w) / 2); }
    .authInner{ position: relative; z-index: 1; }
    /* Carte sans bord : flou + voile sombre qui s'effacent vers les bords.
       Un masque désactive backdrop-filter (Chrome/Edge) : on floute donc une
       copie du fond, calée sur l'écran (fixed) pour coïncider avec .space. */
    .authGlass{
      position: absolute;
      z-index: 0;
      inset: -120px -190px;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 55%, transparent 100%);
      pointer-events: none;
    }
    .authGlass::before{
      content: '';
      position: absolute;
      inset: -40px;
      background: url('https://wallpapercave.com/wp/wp11333140.jpg') center center / cover no-repeat fixed;
      filter: blur(14px);
    }
    .authGlass::after{
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(2,8,18,.62);
    }

    .tabs{ display: none; }

    .form{ display:flex; flex-direction:column; gap:14px; }

    /* Champs : style de la fenêtre Compte */
    .field{ display:flex; flex-direction:column; gap:5px; }
    .field label,
    .fieldLabel{
      color: var(--label);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .inputWrap{ display:flex; align-items:center; gap:6px; }
    input[type="text"],
    input[type="email"],
    input[type="password"]{
      flex: none;
      min-width: 0;
      width: 100%;
      height: 38px;
      padding: 7px 11px;
      border: 1px solid rgba(124,240,255,.3);
      border-radius: 6px;
      outline: none;
      color: #eaffff;
      background: rgba(0,20,35,.8);
      font: 700 13px/1.2 ui-sans-serif, system-ui;
      text-align: center;
      appearance: none;
      /* Le fond (y compris celui imposé au pré-remplissage) ne passe jamais
         sous la bordure semi-transparente : sinon bord jaune/vert. */
      background-clip: padding-box;
    }
    input::placeholder{ color: rgba(158,238,255,.45); }
    /* Champs pré-remplis par le navigateur : garder le style normal (pas de
       fond jaune/bleu). Le fond est repeint par une ombre interne. */
    /* Le navigateur le réapplique quand le formulaire réapparaît (retour
       depuis "oublié ?") : contour et halo forcés aux valeurs normales. */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:active,
    input:-webkit-autofill:focus,
    input:autofill{
      -webkit-text-fill-color: #eaffff !important;
      caret-color: #eaffff;
      border: 1px solid rgba(124,240,255,.3) !important;
      outline: none !important;
      -webkit-box-shadow: 0 0 0 1000px rgb(4,18,30) inset !important;
      box-shadow: 0 0 0 1000px rgb(4,18,30) inset !important;
      filter: none !important;
      background-clip: padding-box !important;
      transition: background-color 99999s ease-out 0s, color 99999s ease-out 0s;
    }
    input:-webkit-autofill:focus,
    input:autofill:focus{
      border-color: #7cf0ff !important;
      -webkit-box-shadow: 0 0 0 1000px rgb(4,18,30) inset, 0 0 10px rgba(0,217,255,.25) !important;
      box-shadow: 0 0 0 1000px rgb(4,18,30) inset, 0 0 10px rgba(0,217,255,.25) !important;
    }
    input:focus{
      border-color: #7cf0ff;
      box-shadow: 0 0 10px rgba(0,217,255,.25);
    }

    /* Bouton play du P.E.T (œil, Connexion) */
    .petBtn{
      height: 38px;
      padding: 0 14px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid rgba(124,240,255,.38);
      background: linear-gradient(135deg, rgba(0,145,190,.38), rgba(0,70,100,.34));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      color: #eaffff;
      font: 750 12px/1 ui-sans-serif, system-ui;
      letter-spacing: .6px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .petBtn svg{
      width: 16px;
      height: 16px;
      display: block;
      filter: drop-shadow(0 0 4px rgba(0,217,255,.6));
      pointer-events: none;
    }
    .petBtn:hover:not(:disabled){
      border-color: rgba(124,240,255,.62);
      background: rgba(0,140,185,.3);
      box-shadow: 0 0 16px rgba(0,217,255,.12);
    }
    .petBtn:disabled{ opacity: .35; cursor: default; }
    .petBtn:focus-visible{ outline: none; box-shadow: 0 0 0 3px rgba(0,217,255,.3); }
    /* Œil intégré dans le champ (à droite), même hauteur que les autres champs. */
    .inputWrap{ position: relative; }
    /* Marges égales des deux côtés : le texte reste centré malgré l'œil. */
    .inputWrap:has(.eyeBtn) input{ padding-left: 44px; padding-right: 44px; }
    .eyeBtn{
      position: absolute;
      top: 50%;
      right: 4px;
      width: 34px;
      height: 30px;
      padding: 0;
      transform: translateY(-50%);
      /* Icône seule, sans cadre. */
      border: 0;
      background: none;
      box-shadow: none;
      color: rgba(158,238,255,.7);
    }
    .eyeBtn:hover:not(:disabled){ border: 0; background: none; box-shadow: none; color: #eaffff; }
    .eyeBtn:focus-visible{ box-shadow: none; color: #eaffff; }
    .eyeBtn svg{ width: 16px; height: 16px; }
    .btn{ width: 100%; margin-top: 4px; }

    /* Liens orange (oublié, s'inscrire...) */
    .authHelpLink{
      align-self: flex-start;
      padding: 0;
      border: 0;
      background: none;
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
      cursor: pointer;
    }
    .authHelpLink:hover{ text-decoration: underline; text-underline-offset: 3px; }
    .authHelpLink:focus-visible{ outline: none; text-decoration: underline; }
    .authSwitch{ align-self: center; font-size: 12px; }
    /* Champs de connexion collés, ligne "oublié" réduite et centrée. */
    .loginFields{ gap: 6px; }
    .authForgot{
      align-self: center;
      margin-top: 2px;
      color: var(--orange);
      font-size: 10px;
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .authForgot .authHelpLink{ font-size: inherit; }
    /* Connexion + S'inscrire : même bouton, espacés. */
    .authActions{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
    .authActions .btn{ margin-top: 0; }
    /* Libellé lu par les lecteurs d'écran, invisible à l'écran. */
    .srOnly{
      position: absolute !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .rememberRow{ display:none; }

    /* Firmes : portrait du personnage, nom + emblème en bas. Grisé tant
       que la firme n'est pas choisie. */
    .factionChoices{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .factionChoice{ position:relative; cursor:pointer; }
    .factionChoice input{ position:absolute; opacity:0; pointer-events:none; }
    .factionChoiceBody{
      position: relative;
      display: block;
      aspect-ratio: 130 / 177;
      overflow: hidden;
      border: 1px solid rgba(124,240,255,.3);
      border-radius: 6px;
      background: rgba(0,20,35,.8);
      color: rgba(232,244,255,.75);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .factionPortrait{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(.85) brightness(.6);
      transition: filter .2s ease, transform .2s ease;
    }
    .factionChoiceBody strong{
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 18px 4px 6px;
      background: linear-gradient(180deg, transparent, rgba(0,12,22,.92) 70%);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .7px;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .factionEmblem{ width:12px; height:12px; image-rendering:pixelated; }
    .factionChoice:hover .factionPortrait{ filter: grayscale(.4) brightness(.8); }
    .factionChoice:hover .factionChoiceBody{ border-color: rgba(124,240,255,.55); }
    .factionChoice input:checked + .factionChoiceBody{
      color: #fff;
      border-color: #7cf0ff;
      box-shadow: 0 0 10px rgba(0,217,255,.25);
    }
    .factionChoice input:checked + .factionChoiceBody .factionPortrait{ filter: none; transform: scale(1.04); }
    .factionChoice input:focus-visible + .factionChoiceBody{ box-shadow: 0 0 0 3px rgba(0,217,255,.3); }

    /* Messages : sous le bloc, hors du flux (leur apparition ne fait pas
       bouger la page centrée). */
    .msg{
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 14px);
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }
    .msg.ok{ display:block; color:var(--ok); border:1px solid rgba(61,255,140,.32); background:rgba(0,20,35,.8); }
    .msg.err{ display:block; color:var(--danger); border:1px solid rgba(255,107,122,.38); background:rgba(0,20,35,.8); }

    /* Récupération du compte : remplace le formulaire de connexion */
    .recoveryPanel{ position:relative; display:flex; flex-direction:column; gap:14px; }
    /* Titre et phrase centrés, la phrase tient sur une ligne. */
    .recoveryHead{ display:flex; flex-direction:column; align-items:center; text-align:center; }
    .recoveryIcon{ display:none; }
    .recoveryHead strong{
      display: block;
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.9);
    }
    .recoveryHead p{ margin-top:4px; color:var(--info); font-size:11px; font-weight:600; line-height:1.45; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,.9); }
    .recoveryBack{ align-self:center; }

    .hidden{ display:none !important; }
    /* Arrivée sur /register (classe posée dans le <head>). */
    html.routeJoin #formLogin{ display:none !important; }
    html.routeJoin #formJoin{ display:flex !important; }

    @media (max-width: 480px){
      .shell::after{ display:none; }
      .auth{ margin-top: 24px; }
      .shell{ --logo-w: min(300px, 80vw); }
    }
  </style>
</head>

<body>
  <div class="space"></div>

  <main class="shell">
    <img class="brand" src="/ASSETS/UI/LOGO.png" width="1774" height="887" alt="Hyperion Orbit" draggable="false" fetchpriority="high" />

    <div class="auth">
      <div class="authGlass" aria-hidden="true"></div>
      <div class="authInner">
      <!-- Onglets conservés pour AUTH.js, remplacés par les liens orange. -->
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Connexion</button>
        <button id="tabJoin" class="tab" type="button">Inscription</button>
      </div>

      <!-- CONNEXION -->
      <form id="formLogin" class="form" autocomplete="on">
        <div class="field loginFields">
          <label class="srOnly" for="loginUser">Pseudo</label>
          <input id="loginUser" type="text" autocomplete="username" placeholder="Pseudo" />
          <label class="srOnly" for="loginPass">Mot de passe</label>
          <div class="inputWrap">
            <input id="loginPass" type="password" autocomplete="current-password" placeholder="Mot de passe" />
            <button id="toggleLoginPass" class="petBtn eyeBtn" type="button" aria-label="Afficher/masquer">
              <svg id="eyeLoginOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeLoginOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
          <p class="authForgot"><button id="forgotUsername" class="authHelpLink" type="button">Nom d'utilisateur</button> ou <button id="forgotPassword" class="authHelpLink" type="button">mot de passe</button> oublié ?</p>
        </div>

        <div class="rememberRow">
          <input id="rememberMe" type="checkbox">
          <label for="rememberMe">Se souvenir de moi</label>
        </div>

        <div class="authActions">
          <button id="btnLogin" class="petBtn btn" type="button">Connexion</button>
          <button id="goJoin" class="authHelpLink authSwitch" type="button">Pas de compte ? Crées-en un nouveau</button>
        </div>
      </form>

      <!-- RÉCUPÉRATION -->
      <section id="recoveryPanel" class="recoveryPanel hidden" aria-live="polite">
        <div class="recoveryHead">
          <strong id="recoveryTitle">Récupération du compte</strong>
          <p id="recoveryHint"></p>
        </div>
        <div id="recoveryEmailFields" class="field">
          <label class="srOnly" for="recoveryEmail">Adresse email du compte</label>
          <input id="recoveryEmail" type="email" autocomplete="email" placeholder="Adresse email du compte" />
        </div>
        <div id="resetPasswordFields" class="form hidden">
          <div class="field"><label for="resetPassword">Nouveau mot de passe</label><input id="resetPassword" type="password" autocomplete="new-password" placeholder="Minimum 10 caractères" /></div>
          <div class="field"><label for="resetPasswordConfirm">Confirmation</label><input id="resetPasswordConfirm" type="password" autocomplete="new-password" placeholder="Répète le mot de passe" /></div>
        </div>
        <button id="recoverySubmit" class="petBtn btn" type="button">Envoyer</button>
        <button id="recoveryBack" class="authHelpLink recoveryBack" type="button">← Retour à la connexion</button>
      </section>

      <!-- INSCRIPTION -->
      <form id="formJoin" class="form hidden" autocomplete="on">
        <div class="field">
          <label class="srOnly" for="regUser">Pseudo</label>
          <input id="regUser" type="text" autocomplete="username" placeholder="Pseudo" />
        </div>

        <div class="field">
          <label class="srOnly" for="regEmail">Adresse email</label>
          <input id="regEmail" type="email" autocomplete="email" inputmode="email" placeholder="Adresse email" />
        </div>

        <div class="field">
          <span class="srOnly">Choisis ta firme</span>
          <div class="factionChoices" role="radiogroup" aria-label="Firme du pilote">
            <label class="factionChoice"><input type="radio" name="regFaction" value="mmo"><span class="factionChoiceBody"><img class="factionPortrait" src="/ASSETS/FACTIONS/MMO_CHAR.png" alt="" draggable="false"><strong><img class="factionEmblem" src="/ASSETS/FACTIONS/MMO.png" alt="">MMO</strong></span></label>
            <label class="factionChoice"><input type="radio" name="regFaction" value="eic"><span class="factionChoiceBody"><img class="factionPortrait" src="/ASSETS/FACTIONS/EIC_CHAR.png" alt="" draggable="false"><strong><img class="factionEmblem" src="/ASSETS/FACTIONS/EIC.png" alt="">EIC</strong></span></label>
            <label class="factionChoice"><input type="radio" name="regFaction" value="vru"><span class="factionChoiceBody"><img class="factionPortrait" src="/ASSETS/FACTIONS/VRU_CHAR.png" alt="" draggable="false"><strong><img class="factionEmblem" src="/ASSETS/FACTIONS/VRU.png" alt="">VRU</strong></span></label>
          </div>
        </div>

        <div class="field">
          <label class="srOnly" for="regPass">Mot de passe</label>
          <div class="inputWrap">
            <input id="regPass" type="password" autocomplete="new-password" placeholder="Mot de passe (10 caractères min.)" />
            <button id="toggleRegPass" class="petBtn eyeBtn" type="button" aria-label="Afficher/masquer">
              <svg id="eyeRegOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeRegOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="srOnly" for="regPass2">Confirmation du mot de passe</label>
          <div class="inputWrap">
            <input id="regPass2" type="password" autocomplete="new-password" placeholder="Confirmation du mot de passe" />
            <button id="toggleRegPass2" class="petBtn eyeBtn" type="button" aria-label="Afficher/masquer">
              <svg id="eyeReg2Open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeReg2Off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="btnRegister" class="petBtn btn" type="button">Créer un compte pilote</button>
        <button id="goLogin" class="authHelpLink authSwitch" type="button">Déjà un compte ? Se connecter</button>
      </form>

      <div id="msg" class="msg"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/PUBLIC/AUTH.js"></script>
</body>
</html>
